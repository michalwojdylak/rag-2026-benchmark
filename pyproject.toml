[project]
name = "rag-2026-benchmark"
version = "0.1.0"
description = "Head-to-head benchmark of 2024-2026 RAG ideas (agentic, RL-trained, graph, metacognitive) on one shared OpenSearch retriever"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.100",
    "opensearch-py>=2.6",
    "sentence-transformers>=3.3",
    "torch>=2.4",
    "numpy",
    "pandas",
    "pyyaml",
    "tqdm",
    "rapidfuzz",
    "tiktoken",
    "networkx",
    "matplotlib",
    "tabulate",
    "nltk",
    "lightrag-hku",
]

[project.scripts]
ragbench = "ragbench.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]
